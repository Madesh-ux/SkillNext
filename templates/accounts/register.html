{% extends "base.html" %}

{% block content %}

<div class="container mt-5" style="max-width:600px;">

    <div class="card shadow">

        <div class="card-body">

            <h2 class="text-center mb-4">
                Register
            </h2>

            <form method="POST">

                {% csrf_token %}

                {{ form.as_p }}

                <button class="btn btn-primary w-100">
                    Create Account
                </button>

            </form>

        </div>

    </div>

</div>

{% endblock %}
