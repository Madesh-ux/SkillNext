{% extends "base.html" %}

{% block content %}

<div class="container mt-5" style="max-width:600px;">

    <div class="card shadow">

        <div class="card-body">

            <h2 class="text-center mb-4">
                Login
            </h2>

            <form method="POST">

                {% csrf_token %}

                {{ form.as_p }}

                <button type="submit" class="btn btn-success w-100">
                    Login
                </button>

            </form>

        </div>

    </div>

</div>

{% endblock %}
